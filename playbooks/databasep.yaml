---
- name: Instalar y configurar el servidor MariaDB
  hosts: ubuntu01
  become: true

  vars_files:
    - ../vars/database.yaml

  tasks:

    - name: Instalar MariaDB y dependencias de Python
      ansible.builtin.apt:
        name:
          - mariadb-server
          - mariadb-client
          - python3-pymysql
        state: present
        update_cache: true

    - name: Habilitar e iniciar MariaDB
      ansible.builtin.systemd_service:
        name: mariadb
        state: started
        enabled: true

    - name: Esperar que MariaDB esté disponible por socket
      ansible.builtin.wait_for:
        path: /run/mysqld/mysqld.sock
        state: present
        timeout: 30

    - name: Eliminar usuarios anónimos
      ansible.mysql.mysql_user:
        name: ""
        host_all: true
        state: absent
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Eliminar la base de datos de prueba
      ansible.mysql.mysql_db:
        name: test
        state: absent
        login_unix_socket: /run/mysqld/mysqld.sock

   
    - name: Configurar MariaDB para escuchar en todas las interfaces
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: Reiniciar MariaDB


    - name: Crear la base de datos
      ansible.mysql.mysql_db:
        name: "{{ DB_DBASE }}"
        state: present
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Crear usuario para el servidor Apache y otorgar permisos
      ansible.mysql.mysql_user:
        name: "{{ DB_USER }}"
        host: "%"
        password: "{{ DB_PASS }}"
        priv: "{{ DB_DBASE }}.*:SELECT"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock
     
    - name: Permitir puerto 3306
      community.general.ufw:
        rule: allow
        port: "3306"
        proto: tcp


  handlers:

    - name: Reiniciar MariaDB
      ansible.builtin.systemd_service:
        name: mariadb
        state: restarted
