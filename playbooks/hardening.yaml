---

- name: Initial ubuntu hardining
  hosts: ubuntu
  become: yes
 
  tasks:
 
  - name: Update installed packages
    ansible.builtin.apt:
      name: "*"
      update_cache: true
      state: latest
      autoremove: true
    notify: Reboot servers
 
  - name: UFW is installed
    ansible.builtin.apt:
      name: ufw
      state: present


  - name: Reset UFW to default
    community.general.ufw:
      state: reset 
        
  - name: Define outgoing connection policy
    community.general.ufw:
      direction: outgoing
      policy: allow

  - name: Define incoming connection policy
    community.general.ufw:
      direction: incoming
      policy: deny

      
  - name: Allow SSH connections
    community.general.ufw:
      name: OpenSSH
      rule: allow
     
 
  - name: Enable UFW
    community.general.ufw:
      state: enabled  
      
 
  handlers: 

  - name: Reboot servers
    ansible.builtin.reboot:
      reboot_timeout: 300


      
   




