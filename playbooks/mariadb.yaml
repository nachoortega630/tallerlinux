---
- name: Instalar, asegurar y configurar MariaDB
  hosts: ubuntu
  become: true

  vars_files:
    - ../vars/database.yaml

  tasks:

    # ---------------------------------------------------------
    # INSTALACIÓN
    # ---------------------------------------------------------

    - name: Actualizar cache de APT
      ansible.builtin.apt:
        update_cache: true

    - name: Instalar MariaDB y dependencias de Python
      ansible.builtin.apt:
        name:
          - mariadb-server
          - mariadb-client
          - python3-pymysql
        state: present

    - name: Habilitar e iniciar MariaDB
      ansible.builtin.systemd:
        name: mariadb
        state: started
        enabled: true


    # ---------------------------------------------------------
    # CONFIGURACIÓN DE RED
    # ---------------------------------------------------------

    - name: Configurar MariaDB para escuchar en todas las interfaces
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^\s*bind-address\s*='
        line: 'bind-address = 0.0.0.0'
      notify: Reiniciar MariaDB


    # ---------------------------------------------------------
    # HARDENING
    # ---------------------------------------------------------

    - name: Eliminar usuarios anonimos
      community.mysql.mysql_user:
        name: ""
        host_all: true
        state: absent
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Eliminar base de datos de prueba
      community.mysql.mysql_db:
        name: test
        state: absent
        login_unix_socket: /run/mysqld/mysqld.sock


    # ---------------------------------------------------------
    # BASE DE DATOS
    # ---------------------------------------------------------

    - name: Crear base de datos
      community.mysql.mysql_db:
        name: "{{ DB_DBASE }}"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock


    # ---------------------------------------------------------
    # USUARIO Y PERMISOS
    # ---------------------------------------------------------

    - name: Crear usuario de la aplicacion
      community.mysql.mysql_user:
        name: "{{ DB_USER }}"
        host: "%"
        password: "{{ DB_PASS }}"
        priv: "{{ DB_DBASE }}.*:SELECT"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock


    # ---------------------------------------------------------
    # TABLA
    # ---------------------------------------------------------

    - name: Crear tabla cumpleanios
      community.mysql.mysql_query:
        login_db: "{{ DB_DBASE }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        query: |
          CREATE TABLE IF NOT EXISTS cumpleanios (
            id INT AUTO_INCREMENT PRIMARY KEY,
            nombre VARCHAR(100),
            fecha DATE
          );


    # ---------------------------------------------------------
    # DATOS INICIALES
    # ---------------------------------------------------------

    - name: Insertar datos iniciales
      community.mysql.mysql_query:
        login_db: "{{ DB_DBASE }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        query:
          - |
            INSERT INTO cumpleanios (nombre, fecha)
            SELECT 'Frodo Baggins', '2005-01-14'
            WHERE NOT EXISTS (
              SELECT 1
              FROM cumpleanios
              WHERE nombre = 'Frodo Baggins'
            );
          - |
            INSERT INTO cumpleanios (nombre, fecha)
            SELECT 'Aragorn', '2004-02-09'
            WHERE NOT EXISTS (
              SELECT 1
              FROM cumpleanios
              WHERE nombre = 'Aragorn'
            );
          - |
            INSERT INTO cumpleanios (nombre, fecha)
            SELECT 'Arwen Undomiel', '1994-12-09'
            WHERE NOT EXISTS (
              SELECT 1
              FROM cumpleanios
              WHERE nombre = 'Arwen Undomiel'
            );


  handlers:

    - name: Reiniciar MariaDB
      ansible.builtin.systemd:
        name: mariadb
        state: restarted


